# =============================================================================
#  RDD project: canonical class map  (objective O2)
# =============================================================================
#  The single source of truth for how every source dataset's label vocabulary
#  maps onto the project taxonomy. Nothing in the pipeline is allowed to invent
#  a class; if a source label is not listed here the converter fails loudly
#  rather than silently dropping or guessing it.
#
#  Class ids are FROZEN. Renumbering them invalidates every trained checkpoint
#  and every results table produced before the change.
# =============================================================================

version: 1
frozen_on: 2026-09-19

# --- Project taxonomy --------------------------------------------------------
# Core tier: trained and benchmarked. Extended tier: reported separately.
classes:
  - id: 0
    name: C1_longitudinal_crack
    tier: core
    task: detection
    definition: >
      Crack whose dominant axis lies within +/-30 degrees of the direction of
      travel; not part of an interconnected cell pattern.
    expected_instances: 26016          # RDD2022 D00 total

  - id: 1
    name: C2_transverse_crack
    tier: core
    task: detection
    definition: >
      Crack whose dominant axis lies within +/-30 degrees of perpendicular to
      travel. Excludes fine full-width surfacing crazing and cracks within
      300 mm of the pavement edge.
    expected_instances: 11830          # RDD2022 D10 total

  - id: 2
    name: C3_alligator_crack
    tier: core
    task: detection
    definition: >
      Interconnected cracks forming closed cells, typically in a wheel path.
      TMH 9 tie-break: when torn between this and dense longitudinal, label
      alligator.
    expected_instances: 10617          # RDD2022 D20 total

  - id: 3
    name: C4_pothole
    tier: core
    task: detection
    definition: >
      Bounded region of absent surfacing with a texturally distinct interior.
      Absorbs surfacing failures and "blowouts"; severity is an attribute, not
      a separate class.
    expected_instances: 6544           # RDD2022 D40 total

  - id: 4
    name: C5_white_line_blur
    tier: extended
    task: detection
    definition: >
      Painted longitudinal line whose intact painted area is below roughly 70%
      of its nominal extent over a run of at least 2 m.
    expected_instances: 5057           # RDD2022 D44 total
    status: ACTIVE

  - id: 5
    name: C6_crosswalk_blur
    tier: extended
    task: detection
    definition: >
      Crosswalk, stop line or road symbol with the same degree of wear as C5,
      for markings with a two-dimensional footprint.
    expected_instances: 793            # RDD2022 D43 total
    status: ACTIVE

  - id: 6
    name: C7_rutting
    tier: extended
    task: segmentation
    definition: >
      Longitudinal depression confined to a wheel path, evidenced by a
      continuous change in texture or specularity over at least 3 m.
    expected_instances: 902            # measured 2026-10-26: 902 boxes and
                                       # 780 polygons over 503 of 949 images
                                       # (447 are negatives). Counted from
                                       # doi:10.17632/v8mbnvx8pv.1, which the
                                       # data-availability findings had
                                       # recorded as "not located".
    status: PROVISIONAL                # set located and prepared; trained as a
                                       # SEPARATE single-category model, not
                                       # part of the six-class core. Promote
                                       # only once US21 reports a figure.

# --- Source vocabulary -> project class --------------------------------------
# RDD2020 merged D01 into D00 and D11 into D10. We reproduce that merge so that
# RDD2018 and RDD2022 annotations become directly comparable.
sources:

  rdd2022:
    format: pascal_voc
    label_map:
      D00: C1_longitudinal_crack
      D01: C1_longitudinal_crack     # 179 inst, the RDD2020 merge, applied here
      D10: C2_transverse_crack
      D11: C2_transverse_crack       # 45 inst, the RDD2020 merge, applied here
      D20: C3_alligator_crack
      D40: C4_pothole
      D43: C6_crosswalk_blur         # 793 inst
      D44: C5_white_line_blur        # 5,057 inst
      D50: __IGNORE__                # 3,581 inst, manhole / utility cover
      Repair: __IGNORE__             # 1,046 inst, patched road; ambiguous
      "Block crack": __IGNORE__      # 3 inst, too few to learn
      D0w0: __IGNORE__               # 1 inst, typo for D00; see note
    notes: >
      This map is derived from the label strings actually present in the
      released XML annotations, enumerated by running the converter in strict
      mode over the full training set. Do not replace it with the label map
      shipped alongside the dataset: the two do not agree, and the difference
      is not in your favour. The project's reasoning is recorded internally.

      D50 (manhole) and Repair are excluded from the taxonomy but are NOT
      noise, both are candidates for explicit distractor classes, since
      manholes are a documented false-positive trigger (Maeda et al. 2018).
      Revisit once the core classes are working.

      D0w0 is a single-instance typo for D00. It is dropped rather than
      silently corrected, so that the annotation-noise rate stays measurable.

  rdd2018:
    format: pascal_voc
    label_map:
      D00: C1_longitudinal_crack     # longitudinal, wheel-mark part
      D01: C1_longitudinal_crack     # longitudinal, construction-joint part
      D10: C2_transverse_crack       # lateral, equal interval
      D11: C2_transverse_crack       # lateral, construction-joint part
      D20: C3_alligator_crack
      D40: C4_pothole                # composite in the source: see note
      D43: C6_crosswalk_blur
      D44: C5_white_line_blur
    notes: >
      RDD2018's D40 is documented by its own authors as "rutting, bump, pothole,
      separation" merged into one class because the four are hard to separate in
      images, and it scores 2-3% recall in that paper. Mapping it wholesale to
      C4_pothole therefore imports known label noise. Objective O1 calls for a
      stratified re-label of a D40 sample before this mapping is trusted.

  stellenbosch_potholes:
    format: supervisely
    label_map:
      pothole: C4_pothole
    notes: >
      US22's zero-shot test set: Nienaber, Kroon and Booysen, released by
      Stellenbosch University in 2018 under CC0, 11,497 images, as
      redistributed by Dataset Ninja in Supervisely format.

      Pothole is the ONLY annotated class here, so this source can validate C4
      and nothing else. The absence of crack annotations is not evidence that
      these images contain no cracks, since they are road photographs and
      plainly do. Predictions for C1, C2, C3, C5 and C6 on this set are
      reported as an observation and never scored as false positives. Average
      precision
      is per class, so C4's figure is unaffected by them.

      About 74% of the images carry no annotation. In the original corpus these
      are deliberate negatives rather than unlabelled positives, which is what
      makes a false-positive rate computable; the converter records a sample of
      them so that assumption can be checked by eye before the number is used.

      Evaluation only. No South African image is trained on, which is the
      premise US22 rests on and the reason the generated data.yaml has no train
      key at all.

  sekilab_rutting:
    format: yolo_and_coco
    label_map:
      "0": C7_rutting
    notes: >
      US21's corpus: Saha, Arya, Kumar, Maeda and Sekimoto (2022),
      RoadRuttingDatasetSekilab, Mendeley Data, CC BY 4.0,
      doi:10.17632/v8mbnvx8pv.1. 949 images, verified against the publisher's
      SHA-256. From the same laboratory as RDD2022, Arya, Maeda and Sekimoto
      are RDD2022 authors, so the annotation lineage is shared rather than
      merely compatible, which is what makes an eventual joint model defensible.

      The source ships both an object-detection view in YOLO format and a
      semantic-segmentation view as COCO polygons, all single-class. Its class
      0 is remapped onto C7's frozen id of 6, and the prepared datasets keep
      the project's full seven-name vocabulary with only C7 populated, so no
      model's class 0 ever means something different from another's.

      Trained as its own model. Adding a seventh class to the six-class core
      would change nc and invalidate every checkpoint and results table the
      project has produced, and the two corpora are only partially labelled
      with respect to each other: rutting images carry no crack annotations and
      RDD2022 images carry no rutting annotations. A joint model has to address
      that partial labelling and is deliberately out of scope here.

      Scale: these are small crops, masks around 259x194, so US21 trains at
      imgsz 320. Figures from it are not comparable with the project's 640px
      RDD2022 results and are not presented as if they were.

  # Community re-annotations add classes the official releases never had.
  # Listed so the converter can reject them explicitly rather than crash.
  community_forks:
    format: pascal_voc
    label_map:
      D50: __IGNORE__                # manhole / utility cover
      Repair: __IGNORE__             # pending the annotation audit in O1
    notes: >
      Third-party re-annotations have no quality control. Excluded from
      training until audited; see the datasets note in the proposal.

# --- Ignore semantics --------------------------------------------------------
# __IGNORE__ means: drop the annotation but KEEP the image, as background.
# This differs from dropping the image, which would discard a valid negative.
ignore_token: __IGNORE__
