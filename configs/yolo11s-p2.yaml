# US17 variant A: stride-4 detection head
#
# YOLO11s with a fourth detection head at P2/4, alongside the stock P3/8,
# P4/16 and P5/32. Everything else is the stock architecture.
#
# Why: Tier A's two weakest classes are the elongated cracks, C1 at 0.5837 and
# C2 at 0.5441, and Tier B established that the deficit on the high-resolution
# subset is not addressable by tiling because tiling cuts long objects. A
# stride-4 head attacks the same problem from the other direction: it gives the
# detector a feature map at four-pixel stride instead of eight, so a crack that
# occupies two or three pixels of a 640 px input still has a cell to be
# detected in.
#
# Cost: the P2 feature map is four times the area of P3, so this is the most
# expensive place to add a head. Expect a substantial increase in GFLOPs and
# wall clock against the baseline; both are recorded per run because US17 asks
# for parameters, FLOPs and latency per variant.
#
# Train with --transfer-from yolo11s.pt. Built from this file alone the weights
# are random, and comparing that against a COCO-pretrained baseline would
# confound architecture with initialisation. The transfer fills every layer
# whose shape matches and leaves the new head at its initialised values.

# Parameters
nc: 80 # overridden from data.yaml at training time
scales: # the 's' scale is selected from this file's name
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone: unchanged from yolo11.yaml
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2  <- P2/4 features, tapped by the new head
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head: the stock top-down path extended one level down to P2, then a
# bottom-up path back to P5. Mirrors the structure of ultralytics' own
# yolov8-p2.yaml, which is the reference implementation of this change.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)  <- the new level

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
