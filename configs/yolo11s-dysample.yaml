# US17 variant C -- dynamic upsampling in the neck
#
# Stock YOLO11s with both nn.Upsample layers replaced by DySample. Nothing else
# changes.
#
# Why: the stock neck upsamples by copying each cell into a 2x2 block. On a
# feature map carrying a one-cell-wide crack response that produces a blocky
# artefact the following convolution has to undo. DySample predicts a sampling
# offset per output position instead and gathers by bilinear interpolation, so
# the upsampled response can follow the structure rather than the grid.
#
# The offset convolution is zero-initialised, so at step zero this is exactly
# bilinear upsampling and transferred weights start somewhere sensible.
#
# Channel arguments are the SCALED ones for the 's' width: the first upsample
# takes the C2PSA output at 512 channels, the second takes the P4 head at 256.
# See variant B's header for why they are not scaled automatically.
#
# Train with --transfer-from yolo11s.pt.

# Parameters
nc: 80 # overridden from data.yaml at training time
scales: # the 's' scale is selected from this file's name
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone -- unchanged from yolo11.yaml
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head -- stock yolo11 with DySample in place of nn.Upsample
head:
  - [-1, 1, DySample, [512, 2]] # 11  (512 ch at scale s)
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, DySample, [256, 2]] # 14  (256 ch at scale s)
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
